name: Build NuvioDesktop

on:
  push:
    branches: [ "Dev", "main" ]
  pull_request:
    branches: [ "Dev", "main" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The README notes that Linux support is planned for a later phase,
        # so this matrix currently focuses on macOS and Windows.
        os: [macos-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Intentionally omitting `submodules: recursive` to avoid the broken libass-android link

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Compose Multiplatform typically targets Java 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure MPVKit Submodule
        # Pulls the specific 'Nuvio' branch of MPVKit as detailed in the README
        run: |
          git submodule update --init --recursive MPVKit
          git -C MPVKit fetch origin Nuvio
          git -C MPVKit switch Nuvio
          git -C MPVKit pull --ff-only

      - name: "Fetch Windows Dependencies (WebView2 and libmpv)"
        if: runner.os == 'Windows'
        shell: bash
        # Using GITHUB_TOKEN to avoid GitHub API rate limits when downloading releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p windows_deps/libmpv

          nuget install Microsoft.Web.WebView2 -OutputDirectory windows_deps
          WV2_PATH=$(find "$(pwd)/windows_deps" -maxdepth 1 -name "Microsoft.Web.WebView2*" -type d | head -n 1)
          echo "WV2_DIR=$WV2_PATH" >> $GITHUB_ENV
          
 
          gh release download -R shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-v3-*.7z" --dir windows_deps

          MPV_ARCHIVE=$(find windows_deps -maxdepth 1 -name "mpv-dev-x86_64-v3-*.7z" | head -n 1)
          7z x "$MPV_ARCHIVE" -o"windows_deps/libmpv"
          echo "MPV_DIR=$(pwd)/windows_deps/libmpv" >> $GITHUB_ENV

      - name: Build MPVKit (macOS only)
        if: runner.os == 'macOS'
        # macOS requires building the MPVKit libmpv artifacts manually before Gradle runs
        run: |
          cd MPVKit
          make build platform=macos







# ... previous steps ...

      - name: Build MPVKit (macOS only)
        if: runner.os == 'macOS'
        run: |
          cd MPVKit
          make build platform=macos

      # ADD THIS NEW STEP HERE
      - name: Create local.properties
        shell: bash
        run: touch local.properties

      - name: Build and Package Distribution
        shell: bash
        # Packages the app into a native installer (.dmg for macOS, .msi/.exe for Windows)
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows requires the dependency paths to be passed explicitly
            ./gradlew :composeApp:packageDistributionForCurrentOS -Pnuvio.webview2.dir="$WV2_DIR" -Pnuvio.windows.libmpv.runtimeDir="$MPV_DIR"
          else
            # macOS and Linux paths
            ./gradlew :composeApp:packageDistributionForCurrentOS
          fi
          
      # ... Upload Artifacts ...






      - name: Build and Package Distribution
        shell: bash
        # Packages the app into a native installer (.dmg for macOS, .msi/.exe for Windows)
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            # Windows requires the dependency paths to be passed explicitly
            ./gradlew :composeApp:packageDistributionForCurrentOS -Pnuvio.webview2.dir="$WV2_DIR" -Pnuvio.windows.libmpv.runtimeDir="$MPV_DIR"
          else
            # macOS and Linux paths
            ./gradlew :composeApp:packageDistributionForCurrentOS
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NuvioDesktop-${{ runner.os }}
          # This is the standard output path for Compose Multiplatform desktop binaries
          path: |
            composeApp/build/compose/binaries/main/*/*.dmg
            composeApp/build/compose/binaries/main/*/*.msi
            composeApp/build/compose/binaries/main/*/*.exe
          retention-days: 7
